<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Language Translation Tool</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #cccccc;
        }

        textarea {
            width: 95%;
            height: 120px;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        select, button {
            padding: 12px;
            margin: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background: #405cf5;
            color: white;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background: #263fc7;
        }

        #status {
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🌍 Language Translator</h1>
    <p>Translate text between different languages.</p>

    <textarea id="inputText"
        placeholder="Enter text to translate..."></textarea>

    <br>

    <select id="sourceLanguage">
        <option value="en">English</option>
        <option value="mr">Marathi</option>
        <option value="hi">Hindi</option>
        <option value="fr">French</option>
        <option value="es">Spanish</option>
        <option value="de">German</option>
        <option value="ja">Japanese</option>
        <option value="ar">Arabic</option>
    </select>

    <span>➡️</span>

    <select id="targetLanguage">
        <option value="mr">Marathi</option>
        <option value="hi">Hindi</option>
        <option value="en">English</option>
        <option value="fr">French</option>
        <option value="es">Spanish</option>
        <option value="de">German</option>
        <option value="ja">Japanese</option>
        <option value="ar">Arabic</option>
    </select>

    <br>

    <button onclick="translateText()">Translate</button>
    <button onclick="clearText()">Clear</button>

    <h3>Translated Text</h3>

    <textarea id="outputText"
        placeholder="Translation appears here..."
        readonly></textarea>

    <p id="status"></p>
</div>

<script>
async function translateText() {
    const text = document.getElementById("inputText").value.trim();
    const source = document.getElementById("sourceLanguage").value;
    const target = document.getElementById("targetLanguage").value;
    const output = document.getElementById("outputText");
    const status = document.getElementById("status");

    if (!text) {
        status.textContent = "Please enter some text.";
        return;
    }

    if (source === target) {
        output.value = text;
        status.textContent = "Both languages are the same.";
        return;
    }

    status.textContent = "Translating...";
    output.value = "";

    try {
        const url =
            "https://api.mymemory.translated.net/get?q=" +
            encodeURIComponent(text) +
            "&langpair=" + source + "|" + target;

        const response = await fetch(url);
        const data = await response.json();

        if (data.responseStatus === 200 && data.responseData) {
            output.value = data.responseData.translatedText;
            status.textContent = "Translation completed!";
        } else {
            status.textContent =
                "Translation unavailable. Please try again.";
        }
    } catch (error) {
        status.textContent =
            "Connection error. Check your internet and try again.";
    }
}

function clearText() {
    document.getElementById("inputText").value = "";
    document.getElementById("outputText").value = "";
    document.getElementById("status").textContent = "";
}
</script>

</body>
  </html>
